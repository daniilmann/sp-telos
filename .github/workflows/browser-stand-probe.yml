name: Verify offline recovery and all twelve browser scenarios

on:
  push:
    branches: [codex/s10-browser-probe]

permissions:
  actions: read
  contents: read

env:
  FORK_SHA: 04a08b7fc719c79ba90c8a1ce7f8fc9d51317a46
  PLUGIN_SHA: 22cf837c98de0621008614717de37ef9dc4ee6cf
  PLUGIN_BASE_SHA: cab6e3c4e50721ef34326209f755a38170bcfa13
  EXPECTED_SCENARIOS: "12"
  TARGETED_SCENARIOS: "1"
  TYPES_RUN_ID: '44329171660'
  TYPES_ARTIFACT_ID: '14439250082'
  TYPES_SHA256: 5856e5dd5157f651cf63ddc530deb14e2a51d4adcd702bc011409a631757193f
  HUSKY: '0'

jobs:
  browser:
    name: Browser stand with SuperSync
    if: github.ref == 'refs/heads/codex/s10-browser-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: daniilmann/super-productivity
          ref: ${{ env.FORK_SHA }}
          path: fork-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PLUGIN_SHA }}
          path: plugin-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PLUGIN_BASE_SHA }}
          path: plugin-base
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: fork-src/.nvmrc
      - name: Verify both source revisions and set up npm
        run: |
          set -euo pipefail
          [[ $(git -C fork-src rev-parse HEAD) == "$FORK_SHA" ]]
          [[ $(git -C plugin-src rev-parse HEAD) == "$PLUGIN_SHA" ]]
          [[ $(git -C plugin-base rev-parse HEAD) == "$PLUGIN_BASE_SHA" ]]
          npm_dir="$RUNNER_TEMP/npm-11.18.0"
          mkdir -p "$npm_dir/shims"
          archive="$npm_dir/npm.tgz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$archive" https://registry.npmjs.org/npm/-/npm-11.18.0.tgz
          printf '%s  %s\n' \
            '4faecce0be70366d1c67b1012c4adc1246354a6cc45bf589f92003073b05518d547403df1475c542d67a4845e22b4fafcd7cac0af02c7a96cc6814f09eb003fb' \
            "$archive" | sha512sum --check -
          tar -xzf "$archive" -C "$npm_dir" --strip-components=1
          ln -s "$npm_dir/bin/npm-cli.js" "$npm_dir/shims/npm"
          ln -s "$npm_dir/bin/npx-cli.js" "$npm_dir/shims/npx"
          printf '%s\n' "$npm_dir/shims" >> "$GITHUB_PATH"
      - name: Build the fork web application
        working-directory: fork-src
        run: |
          set -euo pipefail
          npm ci --min-release-age=3
          npm run buildFrontend:e2e
          web_root="$PWD/.tmp/angular-dist/browser"
          test -s "$web_root/index.html"
          sha256sum "$web_root/index.html"
          tar --sort=name --mtime='UTC 1970-01-01' --numeric-owner --owner=0 --group=0 \
            -C "$web_root" -cf - . | gzip -n > "$RUNNER_TEMP/stand-web.tar.gz"
          sha256sum "$RUNNER_TEMP/stand-web.tar.gz"
          printf 'SP_TELOS_E2E_WEB_DIR=%s\n' "$web_root" >> "$GITHUB_ENV"
      - name: Download verified branch types
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/e2e-types"
          mkdir -p "$root"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$TYPES_ARTIFACT_ID" > "$root/artifact.json"
          jq -e --argjson run "$TYPES_RUN_ID" --argjson id "$TYPES_ARTIFACT_ID" \
            '.id == $id and .workflow_run.id == $run and (.expired | not)' "$root/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$TYPES_ARTIFACT_ID/zip" > "$root/artifact.zip"
          unzip -p "$root/artifact.zip" plugin-api.tgz > "$root/plugin-api.tgz"
          printf '%s  %s\n' "$TYPES_SHA256" "$root/plugin-api.tgz" | sha256sum --check -
          printf 'TELOS_E2E_TYPES_TGZ=%s\n' "$root/plugin-api.tgz" >> "$GITHUB_ENV"
      - name: Build the plugin package and prepare Chromium
        working-directory: plugin-src
        run: |
          set -euo pipefail
          npm ci --min-release-age=3
          package_path=node_modules/@super-productivity/plugin-api
          mkdir "$RUNNER_TEMP/release-types-original"
          mv "$package_path" "$RUNNER_TEMP/release-types-original/plugin-api"
          mkdir "$package_path"
          tar -xzf "$TELOS_E2E_TYPES_TGZ" -C "$package_path" --strip-components=1
          grep -E '^[[:space:]]+getSyncedDataSaveState\(' "$package_path/dist/"*.d.ts
          npm run typecheck
          npm run build
          npm run pack
          sha256sum sp-telos.zip
          printf 'SP_TELOS_E2E_PLUGIN_ZIP=%s\n' "$PWD/sp-telos.zip" >> "$GITHUB_ENV"
          npx --no-install playwright install --with-deps chromium
      - name: Package the earlier plugin for the rejection check
        working-directory: plugin-base
        run: |
          set -euo pipefail
          npm ci --min-release-age=3
          package_path=node_modules/@super-productivity/plugin-api
          mv "$package_path" "$RUNNER_TEMP/release-types-original/baseline-plugin-api"
          mkdir "$package_path"
          tar -xzf "$TELOS_E2E_TYPES_TGZ" -C "$package_path" --strip-components=1
          npm run build
          npm run pack
          sha256sum sp-telos.zip
          printf 'SP_TELOS_E2E_BASE_ZIP=%s\n' "$PWD/sp-telos.zip" >> "$GITHUB_ENV"
      - name: Run browser tests
        working-directory: plugin-src
        run: |
          set -euo pipefail
          export SP_TELOS_E2E_JWT_SECRET
          SP_TELOS_E2E_JWT_SECRET=$(openssl rand -hex 32)
          image=$(cat server/supersync-image)
          docker compose --env-file /dev/null -p sp-telos-e2e -f tests/e2e/compose.yml config --images | grep -Fx -- "$image"
          docker compose --env-file /dev/null -p sp-telos-e2e -f tests/e2e/compose.yml up -d --wait
          npm run test:e2e -- --list
          verify_report() {
            jq -e --argjson expected "$1" \
              '.stats | {expected,unexpected,flaky,skipped}
                | select(.expected == $expected and .unexpected == 0 and .flaky == 0 and .skipped == 0)' "$2"
          }
          target='offline input survives closing the form and retry obtains a new acknowledgement'
          report="$RUNNER_TEMP/stand-targeted.json"
          target_status=0
          trace_dir="$RUNNER_TEMP/targeted-retry"
          PLAYWRIGHT_JSON_OUTPUT_FILE="$report" npm run test:e2e -- --grep "$target" --reporter=list,json \
            --trace retain-on-failure --output "$trace_dir" || target_status=$?
          if [[ "$target_status" != 0 ]]; then
            python3 - "$trace_dir" <<'PYTHON' || true
          import json
          import pathlib
          import re
          import sys
          import zipfile
          from urllib.parse import urlsplit

          patterns = {
              'bridge-call': 'PluginBridge: Triggering sync for plugin',
              'bridge-resolved': 'PluginBridge: Sync completed successfully',
              'bridge-error': 'PluginBridge: Sync failed',
              'host-already-running': 'Sync already in progress, skipping concurrent sync attempt',
              'host-concurrent-cycle': 'Sync skipped: another sync cycle is in progress',
              'host-encryption-block': 'Sync blocked: encryption operation in progress',
              'host-op-log-start': 'SyncWrapperService: Starting op-log sync',
              'host-no-provider': 'No Sync Provider for sync()',
              'host-invalid-provider': 'Provider does not support operation sync',
              'operation-upload': 'uploadOps',
              'fetch-failure': 'Failed to fetch',
              'no-pending-operations': 'No pending operations to upload',
              'mandatory-encryption-key-missing': 'Encryption is mandatory for this provider but no key is configured yet',
              'download-skipped-upload': 'Skipping upload phase',
              'download-blocked': 'Download blocked by an incompatible operation',
              'upload-rejected-full-state': 'Upload remains blocked because rejected',
              'encryption-password-required': 'DecryptNoPasswordError',
              'auth-failure': 'AuthFailSPError',
              'sync-complete': 'Sync complete, status=IN_SYNC',
              'browser-offline': 'ERR_INTERNET_DISCONNECTED',
              'provider-offline': 'temporary network problem',
          }
          traces = list(pathlib.Path(sys.argv[1]).rglob('trace.zip'))
          if len(traces) != 1:
              raise SystemExit(f'Expected exactly one trace, found {len(traces)}')
          found = []
          retry = None
          with zipfile.ZipFile(traces[0]) as trace:
              for name in trace.namelist():
                  if not name.endswith(('.trace', '.network')):
                      continue
                  for line in trace.read(name).decode().splitlines():
                      event = json.loads(line)
                      kind = event.get('type')
                      if kind == 'before' and 'Click Retry with background sync held' in event.get('title', ''):
                          retry = event.get('startTime')
                      if kind == 'console':
                          message = event.get('text', '')
                          for label, pattern in patterns.items():
                              if pattern in message:
                                  found.append((event.get('time', 0), label))
                          download = re.search(r'Download complete\. kind=([a-z_]+)', message)
                          if download and download[1] in ('no_new_ops', 'ops_processed', 'cancelled', 'server_migration_handled', 'server_migration_skipped', 'blocked_incompatible', 'snapshot_hydrated'):
                              found.append((event.get('time', 0), 'download-outcome ' + download[1]))
                          upload = re.search(r'Upload complete\. uploaded=(\d+), piggybacked=(\d+)', message)
                          if upload:
                              found.append((event.get('time', 0), 'uploaded ' + str(int(upload[1])) + ' piggybacked ' + str(int(upload[2]))))
                      if kind == 'resource-snapshot':
                          request = event.get('snapshot', {}).get('request', {})
                          url = urlsplit(request.get('url', ''))
                          if url.hostname == '127.0.0.1' and url.port == 47901 and url.path in ('/api/sync/ops', '/api/sync/snapshot'):
                              tick = event['snapshot'].get('_monotonicTime', 0)
                              method = request.get('method')
                              status = event['snapshot'].get('response', {}).get('status')
                              if method in ('GET', 'POST') and isinstance(status, int):
                                  found.append((tick, f'SuperSync {method} {url.path} HTTP {status}'))
          print(f'Retry test-step marker: {retry is not None}')
          for tick, label in sorted(found):
              if retry is None or not tick:
                  print(label)
              else:
                  print('before Retry' if tick < retry else 'after Retry', label)
          print(f'Diagnostic observations: {len(found)}')
          PYTHON
          fi
          verify_report "$TARGETED_SCENARIOS" "$report" || target_status=1

          report="$RUNNER_TEMP/stand-candidate.json"
          full_status=0
          PLAYWRIGHT_JSON_OUTPUT_FILE="$report" npm run test:e2e -- --reporter=list,json || full_status=$?
          verify_report "$EXPECTED_SCENARIOS" "$report" || full_status=1

          report="$RUNNER_TEMP/stand-baseline.json"
          status=0
          SP_TELOS_E2E_PLUGIN_ZIP="$SP_TELOS_E2E_BASE_ZIP" PLAYWRIGHT_JSON_OUTPUT_FILE="$report" \
            npm run test:e2e -- --grep 'owner creates edits and closes the three records' --reporter=list,json ||
            status=$?
          [[ "$status" == 1 ]]
          jq -e '.stats | .expected == 0 and .unexpected == 1 and .skipped == 0' "$report"
          jq -e '[.. | objects | .message? | strings] | any(contains("Годовые цели"))' "$report"

          [[ "$target_status" == 0 && "$full_status" == 0 ]]
      - name: Stop the isolated test stack
        if: always()
        working-directory: plugin-src
        run: |
          export SP_TELOS_E2E_JWT_SECRET
          SP_TELOS_E2E_JWT_SECRET=$(openssl rand -hex 32)
          docker compose --env-file /dev/null -p sp-telos-e2e -f tests/e2e/compose.yml down
