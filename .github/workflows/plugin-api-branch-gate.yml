name: Plugin API branch gate

on:
  push:
    branches: [codex/annual-goals]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORK_SHA: aab7f62ec24206e378595b2b82d9764d204504d7
  PACKAGE_NAME: '@super-productivity/plugin-api'
  PACKAGE_VERSION: 20.0.0-fork.5
  HUSKY: '0'

jobs:
  package-types:
    name: Package pinned fork types
    if: github.ref == 'refs/heads/codex/annual-goals'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      fork-sha: ${{ steps.pack.outputs.fork-sha }}
      package-sha256: ${{ steps.pack.outputs.package-sha256 }}
      package-sri: ${{ steps.pack.outputs.package-sri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: daniilmann/super-productivity
          ref: ${{ env.FORK_SHA }}
          path: fork-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: fork-src/.nvmrc
      - name: Set up checksum-verified npm 11.18.0
        run: &verified-npm |
          set -euo pipefail
          npm_dir="$RUNNER_TEMP/npm-11.18.0"
          mkdir "$npm_dir"
          archive="$npm_dir/npm.tgz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$archive" https://registry.npmjs.org/npm/-/npm-11.18.0.tgz
          printf '%s  %s\n' \
            '4faecce0be70366d1c67b1012c4adc1246354a6cc45bf589f92003073b05518d547403df1475c542d67a4845e22b4fafcd7cac0af02c7a96cc6814f09eb003fb' \
            "$archive" | sha512sum --check -
          tar -xzf "$archive" -C "$npm_dir" --strip-components=1
          mkdir "$npm_dir/shims"
          ln -s "$npm_dir/bin/npm-cli.js" "$npm_dir/shims/npm"
          ln -s "$npm_dir/bin/npx-cli.js" "$npm_dir/shims/npx"
          printf '%s\n' "$npm_dir/shims" >> "$GITHUB_PATH"
      - name: Build and inspect the package using the locked compiler
        id: pack
        working-directory: fork-src
        run: |
          set -euo pipefail
          fork_head="$(git rev-parse HEAD)"
          [[ "$fork_head" == "$FORK_SHA" ]] || { echo 'Unexpected fork HEAD.' >&2; exit 1; }
          [[ "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)-fork\.[1-9][0-9]{0,2}$ ]] ||
            { echo 'Invalid fork package version.' >&2; exit 1; }
          upstream="$(sed -n 's/^tag=v//p' fork/upstream-base)"
          [[ "${PACKAGE_VERSION%-fork.*}" == "$upstream" ]] || { echo 'Unexpected upstream version.' >&2; exit 1; }

          toolchain="$RUNNER_TEMP/plugin-api-compiler"
          output="$RUNNER_TEMP/plugin-api-artifact"
          mkdir "$toolchain" "$output"
          node --input-type=module - "$toolchain" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const dest = process.argv[2];
          const lock = JSON.parse(readFileSync('package-lock.json'));
          const compiler = lock.packages['node_modules/typescript'];
          assert.equal(compiler.version, '6.0.3');
          assert.equal(compiler.resolved, 'https://registry.npmjs.org/typescript/-/typescript-6.0.3.tgz');
          assert.match(compiler.integrity, /^sha512-[A-Za-z0-9+/]{86}==$/);
          assert.equal(compiler.dependencies, undefined);

          const root = { name: 'plugin-api-compiler', version: '0.0.0', private: true, devDependencies: { typescript: compiler.version } };
          const packages = { '': root, 'node_modules/typescript': compiler };
          writeFileSync(join(dest, 'package.json'), JSON.stringify(root));
          writeFileSync(join(dest, 'package-lock.json'), JSON.stringify({ name: root.name, version: root.version, lockfileVersion: 3, packages }));
          JS
          npm ci --prefix "$toolchain" --ignore-scripts --min-release-age=3
          (
            cd packages/plugin-api
            npm pkg set --workspaces=false "version=$PACKAGE_VERSION"
            PATH="$toolchain/node_modules/.bin:$PATH" npm pack --workspaces=false --pack-destination "$output"
          )

          archive="$output/plugin-api.tgz"
          mv "$output/super-productivity-plugin-api-$PACKAGE_VERSION.tgz" "$archive"
          tar -xOf "$archive" package/package.json |
            jq -e --arg name "$PACKAGE_NAME" --arg version "$PACKAGE_VERSION" \
              '.name == $name and .version == $version and .types == "dist/index.d.ts"'
          for declaration in global.d.ts dist/global.d.ts dist/index.d.ts dist/types.d.ts; do
            tar -xOf "$archive" "package/$declaration" > "$RUNNER_TEMP/packed-plugin-api.d.ts"
            test -s "$RUNNER_TEMP/packed-plugin-api.d.ts"
          done
          grep -E '^[[:space:]]+getSyncedDataSaveState\(' "$RUNNER_TEMP/packed-plugin-api.d.ts"

          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          sri="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          printf 'fork-sha=%s\npackage-sha256=%s\npackage-sri=%s\n' "$fork_head" "$digest" "$sri" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: plugin-api-types-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-api-artifact/plugin-api.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Record package provenance
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PACKED_SHA: ${{ steps.pack.outputs.fork-sha }}
          PACKAGE_SHA256: ${{ steps.pack.outputs.package-sha256 }}
          PACKAGE_SRI: ${{ steps.pack.outputs.package-sri }}
        run: |
          printf -- '- Run ID %s\n- Artifact ID %s\n- Plugin SHA %s\n- Fork SHA %s\n- Package %s %s\n- SHA-256 %s\n- SRI %s\n- Archive %s\n' \
            "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$GITHUB_SHA" "$PACKED_SHA" "$PACKAGE_NAME" "$PACKAGE_VERSION" \
            "$PACKAGE_SHA256" "$PACKAGE_SRI" "$RUNNER_TEMP/plugin-api-artifact/plugin-api.tgz" |
            tee -a "$GITHUB_STEP_SUMMARY"

  branch-gate:
    name: Branch Plugin API checks
    needs: package-types
    if: always() && github.ref == 'refs/heads/codex/annual-goals'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_JOB_RESULT: ${{ needs.package-types.result }}
      ARTIFACT_ID: ${{ needs.package-types.outputs.artifact-id }}
      PACKED_SHA: ${{ needs.package-types.outputs.fork-sha }}
      PACKAGE_SHA256: ${{ needs.package-types.outputs.package-sha256 }}
      PACKAGE_SRI: ${{ needs.package-types.outputs.package-sri }}
    steps:
      - name: Validate package job outputs before download
        id: validate
        run: |
          set -euo pipefail
          fail() { printf '%s\n' "$1" >&2; exit 1; }
          [[ "$PACKAGE_JOB_RESULT" == success ]] || fail 'The package job did not succeed.'
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ ]] || fail 'Expected one positive artifact ID.'
          (( ARTIFACT_ID <= 9007199254740991 )) || fail 'Artifact ID exceeds the safe integer range.'
          [[ "$PACKED_SHA" =~ ^[0-9a-f]{40}$ && "$PACKED_SHA" == "$FORK_SHA" ]] || fail 'Unexpected fork SHA.'
          [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail 'Missing or malformed archive SHA-256.'
          [[ "$PACKAGE_SRI" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]] || fail 'Missing or malformed archive SRI.'
          wrong_id=1
          if [[ "$wrong_id" == "$ARTIFACT_ID" ]]; then
            wrong_id=2
          fi
          printf 'wrong-id=%s\n' "$wrong_id" >> "$GITHUB_OUTPUT"
      - name: Try downloading a different numeric artifact ID
        id: wrong-artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.validate.outputs.wrong-id }}
          path: ${{ runner.temp }}/wrong-plugin-api-artifact
      - name: Require rejection of the wrong ID
        env:
          WRONG_ID: ${{ steps.validate.outputs.wrong-id }}
          WRONG_ARTIFACT_OUTCOME: ${{ steps.wrong-artifact.outcome }}
        run: |
          [[ "$WRONG_ARTIFACT_OUTCOME" == failure ]] || { echo 'The wrong artifact ID was accepted.' >&2; exit 1; }
          printf 'Rejected artifact ID %s in run %s.\n' "$WRONG_ID" "$GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package-types.outputs.artifact-id }}
          path: ${{ runner.temp }}/plugin-api-artifact
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflow offline with zizmor
        run: |
          set -euo pipefail
          zizmor_dir="$(mktemp -d "$RUNNER_TEMP/zizmor.XXXXXX")"
          archive="$zizmor_dir/zizmor.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$archive" https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            'd185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99' \
            "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$zizmor_dir" zizmor
          env -u GH_TOKEN -u GITHUB_TOKEN "$zizmor_dir/zizmor" --offline --format=github \
            .github/workflows/plugin-api-branch-gate.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Verify the archive and select it in the temporary lockfile
        run: |
          set -euo pipefail
          plugin_head="$(git rev-parse HEAD)"
          [[ "$plugin_head" == "$GITHUB_SHA" ]] || { echo 'Unexpected plugin HEAD.' >&2; exit 1; }
          archive="$RUNNER_TEMP/plugin-api-artifact/plugin-api.tgz"
          verify_digest() {
            [[ "$PACKED_SHA" == "$1" ]] &&
              printf '%s  %s\n' "$PACKAGE_SHA256" "$2" | sha256sum --check -
          }
          verify_identity() {
            tar -xOf "$1" package/package.json |
              jq -e --arg name "$PACKAGE_NAME" --arg version "$PACKAGE_VERSION" \
                '.name == $name and .version == $version and .types == "dist/index.d.ts"'
          }
          require_rejection() {
            local label="$1"
            shift
            if "$@"; then
              printf 'Accepted %s unexpectedly.\n' "$label" >&2
              exit 1
            fi
            printf 'Rejected %s before npm ci.\n' "$label" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          verify_digest "$FORK_SHA" "$archive" || { echo 'The downloaded archive failed source or digest verification.' >&2; exit 1; }
          verify_identity "$archive"
          for declaration in global.d.ts dist/global.d.ts dist/index.d.ts dist/types.d.ts; do
            tar -xOf "$archive" "package/$declaration" > "$RUNNER_TEMP/verified-plugin-api.d.ts"
            test -s "$RUNNER_TEMP/verified-plugin-api.d.ts"
          done
          grep -E '^[[:space:]]+getSyncedDataSaveState\(' "$RUNNER_TEMP/verified-plugin-api.d.ts"

          wrong_sha=0000000000000000000000000000000000000000
          require_rejection 'a mismatched fork SHA' verify_digest "$wrong_sha" "$archive"
          fixtures="$(mktemp -d "$RUNNER_TEMP/plugin-api-rejections.XXXXXX")"
          cp "$archive" "$fixtures/modified.tgz"
          printf '\n' >> "$fixtures/modified.tgz"
          require_rejection 'an altered archive' verify_digest "$FORK_SHA" "$fixtures/modified.tgz"
          mkdir "$fixtures/package"
          for field in name version; do
            replacement='unrelated-plugin-api'
            if [[ "$field" == version ]]; then
              replacement='0.0.0'
            fi
            tar -xOf "$archive" package/package.json |
              jq --arg field "$field" --arg value "$replacement" '.[$field] = $value' > "$fixtures/package/package.json"
            tar -czf "$fixtures/$field.tgz" -C "$fixtures" package/package.json
            require_rejection "an unexpected package $field" verify_identity "$fixtures/$field.tgz"
          done

          node --input-type=module - "$archive" <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const { PACKAGE_NAME: name, PACKAGE_VERSION: version, PACKAGE_SRI: expectedSri } = process.env;
          const archive = process.argv[2];
          const local = 'file:' + archive;
          const integrity = 'sha512-' + createHash('sha512').update(readFileSync(archive)).digest('base64');
          assert.equal(integrity, expectedSri);

          const beforeManifest = JSON.parse(readFileSync('package.json'));
          const beforeLock = JSON.parse(readFileSync('package-lock.json'));
          const manifest = structuredClone(beforeManifest);
          const lock = structuredClone(beforeLock);
          const key = 'node_modules/' + name;
          const release = beforeManifest.dependencies[name];
          assert.equal(lock.lockfileVersion, 3);
          assert.match(release, /^https:\/\/github\.com\/daniilmann\/super-productivity\/releases\/download\//);
          assert.equal(lock.packages[''].dependencies[name], release);
          assert.equal(lock.packages[key].resolved, release);

          manifest.dependencies[name] = local;
          lock.packages[''].dependencies[name] = local;
          Object.assign(lock.packages[key], { version, resolved: local, integrity });
          for (const [path, data] of [['package.json', manifest], ['package-lock.json', lock]]) {
            writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          }

          const writtenManifest = JSON.parse(readFileSync('package.json'));
          const writtenLock = JSON.parse(readFileSync('package-lock.json'));
          assert.equal(writtenManifest.dependencies[name], local);
          assert.equal(writtenLock.packages[''].dependencies[name], local);
          assert.deepEqual(writtenLock.packages[key], { ...beforeLock.packages[key], version, resolved: local, integrity });
          writtenManifest.dependencies[name] = release;
          writtenLock.packages[''].dependencies[name] = release;
          writtenLock.packages[key] = beforeLock.packages[key];
          assert.deepEqual(writtenManifest, beforeManifest);
          assert.deepEqual(writtenLock, beforeLock);
          JS

          printf -- '\n- Verified run ID %s\n- Artifact ID %s\n- Plugin SHA %s\n- Fork SHA %s\n- Package %s %s\n- SHA-256 %s\n- SRI %s\n- Archive %s\n' \
            "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$plugin_head" "$PACKED_SHA" "$PACKAGE_NAME" "$PACKAGE_VERSION" \
            "$PACKAGE_SHA256" "$PACKAGE_SRI" "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up checksum-verified npm 11.18.0
        run: *verified-npm
      - name: Install and prove TypeScript loaded the verified declarations
        run: |
          set -euo pipefail
          npm ci
          archive="$RUNNER_TEMP/plugin-api-artifact/plugin-api.tgz"
          installed="$PWD/node_modules/$PACKAGE_NAME"
          jq -e --arg name "$PACKAGE_NAME" --arg version "$PACKAGE_VERSION" \
            '.name == $name and .version == $version' "$installed/package.json"
          for declaration in global.d.ts dist/global.d.ts dist/index.d.ts dist/types.d.ts; do
            tar -xOf "$archive" "package/$declaration" > "$RUNNER_TEMP/installed-plugin-api.d.ts"
            cmp "$RUNNER_TEMP/installed-plugin-api.d.ts" "$installed/$declaration"
          done
          npm run typecheck
          trace="$RUNNER_TEMP/plugin-api-tsc-resolution.txt"
          npm exec -- tsc --noEmit --traceResolution --listFiles > "$trace" || { cat "$trace"; exit 1; }
          {
            grep -F "Type reference directive '@super-productivity/plugin-api/global' was successfully resolved to '$installed/global.d.ts'" "$trace" &&
            grep -Fx "$installed/dist/types.d.ts" "$trace" &&
            grep -E '^[[:space:]]+getSyncedDataSaveState\(' "$installed/dist/types.d.ts"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm run lint
      - run: npm run format:check
      - run: TZ=Europe/Moscow npm test
      - run: TZ=America/Los_Angeles npm test
      - run: npm run build
      - run: npm run pack
      - run: npm run check:sh
