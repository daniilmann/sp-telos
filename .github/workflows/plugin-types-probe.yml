name: Plugin API package probe

on:
  push:
    branches: [codex/probe-plugin-api-types]

permissions:
  contents: read

env:
  FORK_SHA: 2533cda579c5dceecd44d1571aa1b333171cbc10
  PACKAGE_VERSION: 20.0.0-fork.4
  HUSKY: '0'

jobs:
  package-types:
    name: Package pinned fork types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      fork-sha: ${{ steps.pack.outputs.fork-sha }}
      package-sha256: ${{ steps.pack.outputs.package-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: daniilmann/super-productivity
          ref: ${{ env.FORK_SHA }}
          path: fork-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: fork-src/.nvmrc
      - run: npm install --global npm@11.18.0
      - name: Build the package with the fork's locked compiler
        id: pack
        working-directory: fork-src
        run: |
          set -euo pipefail
          [[ "$FORK_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$FORK_SHA" ]]
          [[ "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)-fork\.[1-9][0-9]{0,2}$ ]]
          upstream="$(sed -n 's/^tag=v//p' fork/upstream-base)"
          [[ "${PACKAGE_VERSION%-fork.*}" == "$upstream" ]]
          toolchain="$RUNNER_TEMP/plugin-api-compiler"
          output="$RUNNER_TEMP/plugin-api-artifact"
          mkdir "$toolchain" "$output"
          node --input-type=module - "$toolchain" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dest = process.argv[2];
          const lock = JSON.parse(readFileSync('package-lock.json'));
          const compiler = lock.packages['node_modules/typescript'];
          assert.match(compiler.version, /^\d+\.\d+\.\d+$/);
          assert.equal(compiler.resolved, 'https://registry.npmjs.org/typescript/-/typescript-' + compiler.version + '.tgz');
          assert.match(compiler.integrity, /^sha512-/);
          assert.equal(compiler.dependencies, undefined);
          const root = { name: 'plugin-api-compiler', version: '0.0.0', private: true, devDependencies: { typescript: compiler.version } };
          const packages = { '': root, 'node_modules/typescript': compiler };
          writeFileSync(join(dest, 'package.json'), JSON.stringify(root));
          writeFileSync(join(dest, 'package-lock.json'), JSON.stringify({ name: root.name, version: root.version, lockfileVersion: 3, packages }));
          JS
          npm ci --prefix "$toolchain" --ignore-scripts --min-release-age=3
          (
            cd packages/plugin-api
            npm pkg set --workspaces=false "version=$PACKAGE_VERSION"
            PATH="$toolchain/node_modules/.bin:$PATH" npm pack --workspaces=false --pack-destination "$output"
          )
          archive="$output/super-productivity-plugin-api-$PACKAGE_VERSION.tgz"
          tar -tzf "$archive" | grep -Fx package/dist/index.d.ts
          tar -xOf "$archive" package/package.json | jq -e --arg version "$PACKAGE_VERSION" '.name == "@super-productivity/plugin-api" and .version == $version'
          mv "$archive" "$output/plugin-api.tgz"
          digest="$(sha256sum "$output/plugin-api.tgz" | cut -d' ' -f1)"
          printf 'fork-sha=%s\npackage-sha256=%s\n' "$FORK_SHA" "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: plugin-api-types-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-api-artifact/plugin-api.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  probe-gate:
    name: Pre-release package gate
    needs: package-types
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_JOB_RESULT: ${{ needs.package-types.result }}
      ARTIFACT_ID: ${{ needs.package-types.outputs.artifact-id }}
      PACKED_SHA: ${{ needs.package-types.outputs.fork-sha }}
      PACKAGE_SHA256: ${{ needs.package-types.outputs.package-sha256 }}
    steps:
      - name: Require the package job and its artifact
        run: |
          set -euo pipefail
          [[ "$PACKAGE_JOB_RESULT" == success && "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package-types.outputs.artifact-id }}
          path: .probe-plugin-api
      - name: Verify and install only the fork package from the current run
        run: |
          set -euo pipefail
          archive=.probe-plugin-api/plugin-api.tgz
          verify_package() {
            [[ "$PACKED_SHA" == "$1" && "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] &&
              printf '%s  %s\n' "$PACKAGE_SHA256" "$2" | sha256sum --check -
          }
          verify_package "$FORK_SHA" "$archive"
          if verify_package "$GITHUB_SHA" "$archive"; then
            echo 'The wrong source SHA was accepted.' >&2
            exit 1
          fi
          echo 'A mismatched source SHA was rejected.'
          cp "$archive" "$RUNNER_TEMP/modified-plugin-api.tgz"
          printf '\n' >> "$RUNNER_TEMP/modified-plugin-api.tgz"
          if verify_package "$FORK_SHA" "$RUNNER_TEMP/modified-plugin-api.tgz"; then
            echo 'The altered package was accepted.' >&2
            exit 1
          fi
          echo 'An altered package was rejected.'
          node --input-type=module - "$archive" <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const name = '@super-productivity/plugin-api';
          const tarball = process.argv[2];
          const local = 'file:' + tarball;
          const pack = JSON.parse(execFileSync('tar', ['-xOf', tarball, 'package/package.json']));
          const manifest = JSON.parse(readFileSync('package.json'));
          const lock = JSON.parse(readFileSync('package-lock.json'));
          const beforeManifest = structuredClone(manifest);
          const beforeLock = structuredClone(lock);
          const root = lock.packages[''];
          const entry = lock.packages['node_modules/' + name];
          assert.equal(pack.name, name);
          assert.equal(pack.version, process.env.PACKAGE_VERSION);
          assert.equal(lock.lockfileVersion, 3);
          assert.ok(manifest.dependencies[name].startsWith('https://'));
          assert.equal(root.dependencies[name], manifest.dependencies[name]);
          assert.equal(entry.resolved, manifest.dependencies[name]);
          manifest.dependencies[name] = local;
          root.dependencies[name] = local;
          Object.assign(entry, {
            version: pack.version,
            resolved: local,
            integrity: 'sha512-' + createHash('sha512').update(readFileSync(tarball)).digest('base64'),
          });
          const installedManifest = structuredClone(manifest);
          const installedLock = structuredClone(lock);
          installedManifest.dependencies[name] = beforeManifest.dependencies[name];
          installedLock.packages[''].dependencies[name] = beforeLock.packages[''].dependencies[name];
          for (const key of ['version', 'resolved', 'integrity']) {
            installedLock.packages['node_modules/' + name][key] = beforeLock.packages['node_modules/' + name][key];
          }
          assert.deepEqual(installedManifest, beforeManifest);
          assert.deepEqual(installedLock, beforeLock);
          for (const [name, data] of [['package.json', manifest], ['package-lock.json', lock]]) {
            writeFileSync(name, JSON.stringify(data, null, 2) + '\n');
          }
          JS
          npm ci
          for declaration in global.d.ts dist/index.d.ts dist/types.d.ts; do
            tar -xOf "$archive" "package/$declaration" > "$RUNNER_TEMP/plugin-api-declaration.d.ts"
            cmp "$RUNNER_TEMP/plugin-api-declaration.d.ts" "node_modules/@super-productivity/plugin-api/$declaration"
          done
          test "$(node -p 'require("./node_modules/@super-productivity/plugin-api/package.json").version')" = "$PACKAGE_VERSION"
          npm exec -- tsc --noEmit --traceResolution > "$RUNNER_TEMP/plugin-api-tsc-resolution.txt"
          grep -F "Type reference directive '@super-productivity/plugin-api/global' was successfully resolved to" "$RUNNER_TEMP/plugin-api-tsc-resolution.txt" |
            grep -F "$PWD/node_modules/@super-productivity/plugin-api/global.d.ts"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: TZ=Europe/Moscow npm test
      - run: TZ=America/Los_Angeles npm test
      - run: npm run build
      - run: npm run pack
      - run: npm run check:sh
